name: Docs

# The README's quickstart is executed here, on a clean checkout, on every
# push. A wrong doc has already cost this project real time — `install.sh
# --start` never recreated a removed network, and the documented upgrade
# procedure was wrong as written — and both read perfectly.
#
# The commands are extracted from README.md rather than copied into this
# file. A copy is the same failure one level removed: it drifts, and the
# workflow goes on passing while the document it was meant to protect stops
# being true. See .github/scripts/run-doc-examples.py for the marker syntax.

on:
  pull_request:
  push:
    branches: [main]
  # The quickstart's dependencies live outside this repository, so it can
  # stop working without anything here changing. Weekly, on the same
  # reasoning as ci.yml's schedule and offset from it so the two are not
  # competing for runners.
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quickstart:
    name: README quickstart runs on a clean checkout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The quickstart seeds seven real feeds and the scheduler's first tick
      # fires immediately, so leaving refresh enabled would have this job
      # pulling the BBC and the Guardian on every push: slow, impolite, and
      # red whenever one of them is having a bad afternoon. Every README
      # command runs exactly as written; only this one documented setting is
      # overridden, and it is overridden through the environment rather than
      # by editing what the document says.
      SOURCE_REFRESH_ENABLED: "false"
    steps:
      # persist-credentials: false because this job's whole purpose is running
      # commands extracted from a file in the repository. The default leaves
      # the checkout token in .git/config where those commands would find it.
      # The workflow's `contents: read` already caps what it could do; not
      # handing it over in the first place is cheaper than reasoning about it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Same action and tool pins as ci.yml so Renovate moves both in one PR.
      # The interpreter is no longer one of them: setup-python reads
      # .python-version, which is the file uv reads too, so the two cannot
      # disagree about which Python this job runs.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Printed before it runs so a failure downstream can be read against
      # the exact script, without rebuilding it mentally from the document.
      - name: The script extracted from README.md
        run: python3 .github/scripts/run-doc-examples.py README.md --print

      # No `uv sync` or `npm ci` step here on purpose: the quickstart's own
      # commands install everything, which is the property under test.
      - name: Execute it
        run: python3 .github/scripts/run-doc-examples.py README.md

  # deploy/README.md carries docs:run markers too, and there is deliberately
  # no job here that runs them. It was written, and it failed, and the reason
  # is worth keeping so nobody writes it again:
  #
  #   [conmon:e]: Include journald in compilation path to log to systemd journal
  #   Error: conmon failed: exit status 1
  #   sre-tab-web.service: Main process exited, code=exited, status=126
  #
  # Ubuntu's conmon is built without journald support, and the three
  # long-running units set LogDriver=journald on purpose — `podman logs` is
  # worth having for them, per deploy/README.md's Operations section. Making
  # this pass on ubuntu-latest would mean overriding LogDriver for CI, which
  # is testing a deployment other than the one that ships, and a green gate
  # over the wrong artefact is worse than no gate.
  #
  # The markers are still worth having: the procedures run end to end on a
  # Debian 13 host with podman 5.4.2, which is what the deployment targets.
  # CONTRIBUTING.md carries the command. What would make this a CI job is a
  # runner whose conmon has journald — a Debian-based self-hosted runner, or a
  # podman build from a repository that ships one.

  links:
    name: Relative links resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Cheap, and it catches both halves of the breakage a link can
      # suffer: a moved file, and a reworded heading. External URLs are not
      # fetched — that would make the gate depend on other people's uptime.
      #
      # The fragment half is checked against declared anchors rather than
      # against slugs computed from heading text; the script's docstring
      # says why at length, and the short version is that reimplementing
      # GitHub's slug rule fails towards a false pass.
      #
      # The job name is deliberately unchanged. It is one of the eight
      # required status checks, and GitHub keys those on the check-run
      # context — renaming this silently empties the requirement, which is
      # the trap CONTRIBUTING.md documents.
      - name: Every relative link and image target exists
        run: python3 .github/scripts/check-doc-links.py

  diagrams:
    name: Mermaid diagrams parse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # persist-credentials: false for the same reason the quickstart job sets
      # it, and the reason applies harder here: this job installs 122 packages
      # this repository did not write and then imports them. The default
      # leaves the checkout token in .git/config, where any of that code could
      # read it. `contents: read` already caps what it would be worth and the
      # repository is public, so this is depth rather than a fix — but not
      # handing it over is cheaper than reasoning about who could take it.
      #
      # The `links` job above deliberately does not set it: it runs one
      # first-party Python script and installs nothing. The distinction is
      # whether a job executes code that arrived with the job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json

      # `npm ci`, not `npm install`: the whole dependency graph is committed
      # in .github/scripts/package-lock.json, so the parser this gate imports
      # and runs is the same 122 packages on every run rather than whatever
      # resolved that morning. `ci` also refuses outright when the manifest
      # and the lockfile disagree — verified by desynchronising them, which
      # exits 1 naming the package.
      #
      # This is a second npm project in the repository and that is the cost of
      # the pin. It is deliberately not part of the client's: a documentation
      # linter has no business in frontend/package-lock.json, in uv.lock, or
      # in the image, and .github/scripts/node_modules is gitignored.
      #
      # happy-dom, not jsdom, because the frontend already vets happy-dom for
      # the two Vitest files that need a document, and one DOM implementation
      # in a repository is enough. The two manifests pin it independently and
      # Renovate moves both in the same weekly group; they are not required to
      # agree, and nothing breaks if they drift. Mermaid does need a DOM:
      # DOMPurify is loaded at parse time and throws without a window — though
      # only for some diagram types, so an absent DOM fails partially rather
      # than cleanly. That is what the script's self-test is for.
      #
      # --ignore-scripts because neither package needs a lifecycle script to
      # work, verified by installing with it and running the gate green.
      - name: Install the parser from the lockfile
        working-directory: .github/scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Parses every ```mermaid block in the tracked Markdown. GitHub renders
      # one it cannot parse as a red "Unable to render rich display" box in
      # place of the diagram, which nothing else here would notice and no
      # reviewer would catch from the diff.
      #
      # This is a syntax gate and only a syntax gate. All nine diagrams in
      # ARCHITECTURE.md parsed on the first attempt and four of them were
      # still wrong when rendered — one had the layout engine draw an edge
      # between two services that never talk to each other. Nothing automates
      # that; the script's header says how to render and look.
      - name: Every mermaid diagram parses
        run: node .github/scripts/check-mermaid.mjs
