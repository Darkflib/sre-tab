name: Docs

# The README's quickstart is executed here, on a clean checkout, on every
# push. A wrong doc has already cost this project real time — `install.sh
# --start` never recreated a removed network, and the documented upgrade
# procedure was wrong as written — and both read perfectly.
#
# The commands are extracted from README.md rather than copied into this
# file. A copy is the same failure one level removed: it drifts, and the
# workflow goes on passing while the document it was meant to protect stops
# being true. See .github/scripts/run-doc-examples.py for the marker syntax.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quickstart:
    name: README quickstart runs on a clean checkout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The quickstart seeds seven real feeds and the scheduler's first tick
      # fires immediately, so leaving refresh enabled would have this job
      # pulling the BBC and the Guardian on every push: slow, impolite, and
      # red whenever one of them is having a bad afternoon. Every README
      # command runs exactly as written; only this one documented setting is
      # overridden, and it is overridden through the environment rather than
      # by editing what the document says.
      SOURCE_REFRESH_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same pins as ci.yml so Renovate moves both in one PR.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Printed before it runs so a failure downstream can be read against
      # the exact script, without rebuilding it mentally from the document.
      - name: The script extracted from README.md
        run: python3 .github/scripts/run-doc-examples.py README.md --print

      # No `uv sync` or `npm ci` step here on purpose: the quickstart's own
      # commands install everything, which is the property under test.
      - name: Execute it
        run: python3 .github/scripts/run-doc-examples.py README.md

  # deploy/README.md's procedures were prose verified by hand until a run on a
  # real Debian 13 host executed them. That pass found the deploy-window claim
  # wrong by a factor of forty and a Containerfile comment contradicting the
  # unit it described — neither of which reading had caught, in a document
  # that has been read carefully several times. So it is executed here too.
  #
  # A separate job from the quickstart above: this one needs podman, root, and
  # live systemd, it pulls the pinned application image, and it takes minutes
  # rather than seconds. Failing it should not be indistinguishable from the
  # README's own commands breaking.
  deploy-procedures:
    name: deploy/README.md procedures run on a clean host
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The three values the document requires an operator to set. They are
      # supplied here exactly as the document says to supply them, through the
      # environment, rather than by rewriting what the document says.
      APP_BASE_URL: http://127.0.0.1:8080
      GITHUB_CLIENT_ID: docs-execution-not-a-real-oauth-app
      GITHUB_CLIENT_SECRET_FILE: /tmp/github-client-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install --yes podman

      # A path, not the secret: the document is explicit that argv never
      # carries it, and this job has to honour that or it is testing a
      # different procedure from the documented one.
      - name: A client secret for the run
        run: |
          umask 077
          printf 'docs-execution-client-secret' > "$GITHUB_CLIENT_SECRET_FILE"

      - name: The script extracted from deploy/README.md
        run: python3 .github/scripts/run-doc-examples.py deploy/README.md --root . --print

      # --root . because the document's commands are written to run from the
      # repository root (`deploy/install.sh`), while the runner would otherwise
      # default to the directory holding the document.
      - name: Execute it
        run: python3 .github/scripts/run-doc-examples.py deploy/README.md --root .

      - name: What the journal saw, on failure
        if: failure()
        run: |
          systemctl --failed --no-pager || true
          for unit in sre-tab-db sre-tab-migrate sre-tab-assets sre-tab sre-tab-web; do
            echo "::group::$unit"
            sudo journalctl -u "$unit.service" -n 60 --no-pager || true
            echo "::endgroup::"
          done

  links:
    name: Relative links resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Cheap, and it catches the class of breakage a moved file causes:
      # every relative link and image in the front-door documents has to
      # point at something that exists. External URLs are not fetched —
      # that would make the gate depend on other people's uptime.
      - name: Every relative link and image target exists
        run: |
          set -euo pipefail
          rc=0
          for doc in README.md CONTRIBUTING.md ROADMAP.md deploy/README.md; do
            while read -r target; do
              case "$target" in
                http://*|https://*|mailto:*|'#'*|'') continue ;;
              esac
              # Strip any anchor: the file has to exist, the fragment is
              # not something this can check without parsing headings.
              path="${target%%#*}"
              [ -n "$path" ] || continue
              if [ ! -e "$(dirname "$doc")/$path" ]; then
                echo "$doc: broken relative link: $path"
                rc=1
              fi
            done < <(grep -oE '\]\([^)]+\)' "$doc" | sed -E 's/^\]\(//; s/\)$//')
          done
          exit "$rc"
