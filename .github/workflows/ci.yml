name: CI

on:
  pull_request:
  # A push to either matches: `branches` and `tags` are alternatives, not a
  # conjunction, so a tag push runs this workflow whether or not the commit
  # it names is on main.
  #
  # `v*` and not `v[0-9]*`: the filter's job is to decide what *runs*, and
  # the shape of a version is decided in one place — the resolver step in
  # `publish` — which refuses anything that is not vMAJOR.MINOR.PATCH and
  # says why. A narrower filter here would split that judgement in two, and
  # the half that lives in a glob cannot explain itself: `v1.1` would simply
  # not run, which reads as a broken workflow rather than as a rejected tag.
  push:
    branches: [main]
    tags: ["v*"]
  # Nothing here is triggered by the passage of time, and several of these
  # jobs answer questions whose answer changes without a commit: a new CVE
  # against a pinned dependency, a base image that has moved underneath the
  # digest we build from, an action yanked from the marketplace, a cosign
  # verification that stops passing. Between pushes this repository is
  # silent about all of it, which is precisely the wrong behaviour for a
  # project that goes weeks without a commit. A weekly run makes the gate
  # report on the world as well as on the diff.
  #
  # Note the one thing this cannot do for itself: GitHub disables scheduled
  # workflows on a repository with no activity for 60 days, and emails the
  # owner rather than failing loudly. Sixty quiet days therefore turns this
  # off, and re-enabling it is a manual step.
  schedule:
    - cron: "17 6 * * 1"
  # Manual runs so an operator returning to the project can ask the same
  # question on demand rather than waiting for Monday.
  workflow_dispatch:

# Least privilege by default; the one job that needs more asks for it.
permissions:
  contents: read

# Keyed on the event as well as the ref: without that, a scheduled run on
# main shares a group with a push to main, and `cancel-in-progress` lets the
# timer cancel a publish.
#
# The ref half is what keeps a release safe from the merge that follows it. A
# tag push carries `refs/tags/v1.1.0` and a branch push carries
# `refs/heads/main`, so the two land in different groups and neither can
# cancel the other — which matters here because tagging and merging are
# minutes apart in practice, and `cancel-in-progress` would otherwise kill a
# half-finished release build that had already pushed an image.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheapest checks first, in one job, so the ordering is the feedback
  # ordering: formatting fails in seconds, mypy in tens of seconds, the test
  # suite last.
  python:
    name: Format, lint, types, security, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv sync --locked --all-groups

      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy .
      - name: bandit
        run: uv run bandit -c pyproject.toml -q -r app
      - name: Security headers match the reverse proxy
        run: deploy/scripts/check-header-parity.sh
      - name: .env.example documents every setting
        run: deploy/scripts/check-env-example.sh
      # Coverage is measured here and nowhere else: the postgres job runs a
      # deliberately narrow subset, so instrumenting it would compare a
      # slice against a whole-tree threshold. `fail_under` lives in
      # pyproject.toml so the number sits next to the rest of the tool
      # configuration rather than buried in this file.
      - name: pytest, with coverage
        run: uv run pytest --cov=app --cov-report=term-missing

  # The SQLite suite cannot reach three things: pg_try_advisory_lock (the
  # scheduler's leader strategy), the PostgreSQL ON CONFLICT branches, and the
  # migration on the engine it actually runs on. Those tests skip without
  # SRE_TAB_POSTGRES_URL, so this job is what makes them a gate.
  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Same pin as deploy/, and no longer on trust: the "Pinned images
        # agree" step in the container job scans this workflow too, so a
        # digest that drifts from the units fails the build rather than
        # quietly testing against a different PostgreSQL than production runs.
        image: postgres:18-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: sretab
          POSTGRES_PASSWORD: sretab
          POSTGRES_DB: sretab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sretab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: pytest — PostgreSQL dialect paths, advisory locks, migrations
        env:
          SRE_TAB_POSTGRES_URL: postgresql+psycopg://sretab:sretab@127.0.0.1:5432/sretab
        run: uv run pytest tests/postgres -v

  # Separate job: these reach the network and report on the dependency set
  # rather than the code, so a fresh CVE advisory should not hide the test
  # results behind a red X on the same job.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv sync --locked --all-groups
      # --skip-editable: uv installs the project itself into the venv, and
      # there is no "sre-tab" on PyPI to look up. Everything else in the
      # locked set is audited.
      - name: pip-audit
        run: uv run pip-audit --skip-editable --progress-spinner=off

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      # No `npm ci` first, deliberately: npm audit resolves the advisory set
      # from package-lock.json alone, so this needs neither a node_modules
      # tree nor the cache the frontend job populates.
      #
      # The gate is the production tree at high and critical. The split is a
      # policy choice, and the policy is chosen to survive contact:
      #
      #   * What ships to a browser is `dependencies`. An advisory there is
      #     reachable by a user and the build should stop.
      #   * `devDependencies` is vite, eslint, typescript and their
      #     transitive trees — hundreds of packages that never leave CI. A
      #     large fraction of their advisories are unfixable for weeks
      #     (a nested dep two majors behind), apply only to a dev server
      #     bound to localhost, or both. Failing on those means the job gets
      #     `continue-on-error`d within a month and then audits nothing, which
      #     is how a gate dies. So the dev tree is reported, not enforced.
      #
      # A dev-tree advisory that genuinely matters — anything with a fix
      # available, anything in a package that runs at build time and touches
      # the output bundle — gets fixed by bumping the dependency, and Renovate
      # opens that PR anyway. The report below is where it is noticed.
      - name: npm audit — production dependencies (gate)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

      - name: npm audit — full tree including dev (report only)
        continue-on-error: true
        run: npm audit --audit-level=low
        working-directory: frontend

  # Semgrep is a separate job for the same reason as the audit above: it
  # fetches its rules from the registry, so a registry hiccup is not a test
  # failure.
  #
  # The guard after the scan is the point of this job existing at all. A
  # semgrep run whose ruleset fails to resolve — `p/bash` 404s, which is how
  # this was found — still exits zero and still writes a well-formed report,
  # with `results: []` and `paths.scanned: []`. A gate that scanned nothing is
  # worse than no gate, because it is green. So the report is inspected before
  # its findings are believed: a non-empty `errors[]`, or a scan that reached
  # no files, fails the job.
  sast:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true

      # Run from an ephemeral tool environment rather than the project's
      # locked dependency set: semgrep is a large tree that the application
      # does not import, and pulling it into uv.lock would put it in
      # pip-audit's scope and in the image's build context.
      #
      # Rulesets are named individually and none of them is `auto`: `auto`
      # resolves against semgrep.dev and changes underneath the repository.
      # p/dockerfile is deliberately absent — semgrep does not recognise a
      # file named Containerfile as a Dockerfile, so it would have run zero
      # rules against zero files while looking like coverage.
      - name: semgrep
        run: |
          # `set +e` on purpose: the runner's default shell is `bash -e`, and
          # semgrep exits non-zero when it finds something. Aborting here
          # would skip the report inspection below, which is the half that
          # decides whether the run meant anything.
          set +e
          uvx semgrep==1.175.0 scan \
            --metrics=off --disable-version-check --oss-only \
            --config p/python \
            --config p/javascript \
            --config p/typescript \
            --config p/github-actions \
            --config p/secrets \
            --config .semgrep \
            --json --output semgrep.json
          echo "semgrep exit status: $?"

      - name: The scan actually ran
        run: |
          set -euo pipefail
          test -f semgrep.json || {
            echo "semgrep wrote no report at all"
            exit 1
          }

          errors=$(jq '.errors | length' semgrep.json)
          scanned=$(jq '.paths.scanned | length' semgrep.json)
          findings=$(jq '.results | length' semgrep.json)

          if [ "$errors" -ne 0 ]; then
            echo "semgrep reported $errors error(s); the scan is not trustworthy:"
            jq -r '.errors[] | "  \(.level // "error"): \(.message)"' semgrep.json
            exit 1
          fi

          if [ "$scanned" -eq 0 ]; then
            echo "semgrep scanned no files. A green run over an empty target"
            echo "set is exactly the failure this check exists to catch."
            exit 1
          fi

          echo "scanned $scanned files, $findings finding(s)"

          if [ "$findings" -ne 0 ]; then
            jq -r '.results[] | "  \(.path):\(.start.line) \(.check_id)\n    \(.extra.message | gsub("\\s+"; " "))"' semgrep.json
            exit 1
          fi

  frontend:
    # Renaming this is a branch-protection change — the required context is
    # this string, not the `frontend` key above. CONTRIBUTING.md carries the
    # read and write commands, and the required set was updated with it.
    name: Frontend lint, types, contract, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend

      # The contract reaches the client through two links, and both are
      # committed artefacts kept in step by hand: the live schema is copied
      # to `frontend/openapi.json`, and `src/api/schema.d.ts` is generated
      # from that copy. Each link is checked where the toolchain for it
      # already exists — the first by tests/test_openapi.py in the `python`
      # job, the second here, because this is the job with node in it.
      #
      # Before `tsc` deliberately. Stale types make the typecheck a check of
      # the wrong contract, so a failure there would be read as a client bug
      # rather than as the regeneration nobody ran.
      - name: The generated API types match the committed document
        run: |
          npm run generate:api
          # `git diff` reports tracked files only, so absence reads as
          # agreement: delete the committed declaration and this step
          # regenerates it as an untracked file, diffs nothing, and goes
          # green — and `tsc` passes too, against the copy just written.
          # A clean checkout would have neither. Reproduced before this
          # guard was added, because a gate that checks nothing is the
          # failure mode this repository keeps meeting.
          git ls-files --error-unmatch -- src/api/schema.d.ts >/dev/null 2>&1 || {
            echo "::error::src/api/schema.d.ts is not tracked. It is a committed artefact; regenerate it and commit the result."
            exit 1
          }
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is stale. Run 'npm run generate:api' and commit the result."
            exit 1
          }
        working-directory: frontend

      - name: eslint
        run: npm run lint
        working-directory: frontend
      - name: tsc
        run: npm run typecheck
        working-directory: frontend
      # Before the build rather than after: the suite is pure logic with no
      # build dependency and runs in under a second, so failing early costs
      # nothing. `npm test` is `vitest run` — one-shot, not the watcher.
      - name: vitest
        run: npm test
        working-directory: frontend
      - name: vite build
        run: npm run build
        working-directory: frontend

  container:
    name: Container build and deployment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # The identity of the bytes this job actually tested. `publish` asserts
      # the image it loads still has this ID before it pushes anything.
      image-id: ${{ steps.build.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install --yes podman

      # For the pinned-image verification below, not for the build.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Built with Podman here and with Docker on developer machines. Same
      # Containerfile, no engine-specific syntax; if that ever stops being
      # true, this is where it surfaces.
      - name: Build image
        id: build
        run: |
          set -euo pipefail
          podman build --format docker --tag sre-tab:ci .
          image_id=$(podman image inspect sre-tab:ci --format '{{.Id}}')
          echo "image-id=$image_id" >> "$GITHUB_OUTPUT"
          echo "built $image_id"

      # --format docker above is load-bearing: OCI format has no HEALTHCHECK
      # field, and sre-tab.container's Notify=healthy waits on the image's
      # healthcheck. An OCI-format build would hang the unit until
      # TimeoutStartSec instead of failing fast, so assert it survived.
      - name: Image carries a healthcheck and runs unprivileged
        run: |
          set -euo pipefail
          podman image inspect sre-tab:ci --format '{{json .}}' > /tmp/image.json
          # Podman reports this at top-level `Healthcheck` -- capital H,
          # lowercase c. `.HealthCheck` and `.Config.Healthcheck` are both
          # absent, so the original spelling asserted nothing and this job
          # had never once passed. Docker's spellings kept as fallbacks.
          jq -e '(.Healthcheck // .Config.Healthcheck // .HealthCheck) != null' \
            /tmp/image.json > /dev/null
          jq -e '.Config.User == "10001:10001"' /tmp/image.json > /dev/null
          test "$(podman run --rm sre-tab:ci id -u)" = "10001"

      # sre-tab.container cannot set NoNewPrivileges=true — podman's AppArmor
      # profile denies signal delivery under no_new_privs on Debian 13, and
      # the unit carries the measurements. Stripping every setuid and setgid
      # bit at build time is the stand-in, so this is a load-bearing property
      # of the image and not hardening trivia.
      #
      # Asserted here, from outside, because the Containerfile layer that
      # removes them used to end in `|| true` and nothing checked the result.
      # A step that reports the UID while the escalation bits ship intact is
      # exactly the shape of green check this repository keeps finding.
      - name: No setuid or setgid files survive in the image
        run: |
          set -euo pipefail
          found=$(podman run --rm --user 0:0 sre-tab:ci \
            find / -xdev -perm /6000 -type f)
          if [ -n "$found" ]; then
            echo "::error::image ships setuid/setgid binaries:"
            echo "$found"
            exit 1
          fi
          echo "no setuid or setgid files in the image"

      # The PostgreSQL and Caddy digests appear in the units, in the scripts,
      # and in this workflow, so that a restore, a smoke test, and CI all run
      # the same build as production. This is what stops those copies drifting
      # apart.
      #
      # .github/workflows is in scope because it used to be exempt: the
      # PostgreSQL service container below carried a hand-maintained copy of
      # the same digest with a comment admitting nothing checked it, which is
      # a comment describing a bug rather than a design.
      - name: Pinned images agree across deploy/ and the workflows
        run: |
          set -euo pipefail
          for image in postgres:18-trixie caddy:2.11.4-alpine; do
            count=$(grep -rho "$image@sha256:[0-9a-f]\{64\}" deploy .github/workflows | sort -u | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "digest drift for $image:"
              grep -rn "$image@sha256:" deploy .github/workflows
              exit 1
            fi
          done

          # A new reference that names the tag and no digest is the other way
          # this check can pass while being wrong: one digest would still be
          # the only digest. Only actual image references are considered —
          # a registry path (`.../caddy:tag`) or a YAML `image:` key — so that
          # prose mentioning a tag is not a build failure.
          if grep -rn --include='*.yml' --include='*.sh' --include='*.container' \
              -E '(/|image: )(postgres:18-trixie|caddy:2\.11\.4-alpine)([^@]|$)' \
              deploy .github/workflows; then
            echo "the references above name a tag without pinning a digest"
            exit 1
          fi

      # The application image is ours, so it gets a stricter check than the
      # third-party pins above: one digest, named by every unit that runs
      # it, and never a bare tag. They are one artefact — migrations, the
      # application, the frontend assets, and the session sweep all ship in
      # a single image so they cannot skew — and a promotion that updated
      # only some of them would reintroduce exactly the skew that design
      # exists to prevent.
      #
      # Deliberately counted rather than enumerated, so adding a unit needs
      # no edit here. The list that does need the edit is `UNITS` in
      # deploy/scripts/promote.sh: a unit missing from it is not a slow
      # drift but the next promotion failing this gate outright.
      - name: The application image is pinned, by digest, in one place
        run: |
          set -euo pipefail
          refs=$(grep -rho '^Image=ghcr\.io/darkflib/sre-tab.*$' deploy/quadlet | sort -u)
          count=$(printf '%s\n' "$refs" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "the application units do not agree on one image:"
            grep -rn '^Image=ghcr\.io/darkflib/sre-tab' deploy/quadlet
            exit 1
          fi
          case "$refs" in
            *@sha256:*) ;;
            *)
              echo "the application image is not pinned by digest: $refs"
              echo "use deploy/scripts/promote.sh; do not hand-edit the pin."
              exit 1
              ;;
          esac
          echo "${refs#Image=}"

      # Signed is not verified until something verifies it, and this is the
      # something. Every push and every pull request re-checks that the
      # digest the units will deploy carries a cosign signature from this
      # repository's publish job, plus SLSA provenance and an SBOM.
      #
      # This is the enforcement point, and it is deliberately here rather
      # than on the host: podman's containers-policy.json can express a
      # sigstore identity only as `fulcio.subjectEmail`, which is mandatory,
      # and a GitHub Actions keyless certificate carries a URI SAN instead —
      # measured on Debian 13 with podman 5.4.2, not merely read in a man
      # page. So nothing verifies at container start, here or anywhere. What
      # this buys is that an unverifiable digest cannot survive in the
      # repository: it fails the build that would have shipped it.
      - name: The pinned image is signed, with provenance and an SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: deploy/scripts/verify-image.sh --require-attestations

      - name: Validate the Caddy configuration
        run: |
          podman run --rm --read-only --user 65532:65532 \
            --security-opt=no-new-privileges --cap-drop all --cap-add NET_BIND_SERVICE \
            --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            docker.io/library/caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # Generates the systemd units from the Quadlet sources and fails on a
      # malformed key. This is the only place the Quadlets get machine-checked
      # at all — they cannot be generated on the macOS development host.
      - name: Validate Quadlet generation
        run: |
          QUADLET_UNIT_DIRS="$PWD/deploy/quadlet" \
            /usr/lib/systemd/system-generators/podman-system-generator --dryrun

      - name: Installer stages cleanly
        run: |
          set -euo pipefail
          DESTDIR="$(mktemp -d)" deploy/install.sh

      # Acceptance criterion 6, executed: fresh PostgreSQL, migrations,
      # health checks — plus the PRD's "test restore before release" gate,
      # through the same restore script an operator would run.
      - name: Deployment smoke test — migrations, health, backup, restore
        run: SRE_TAB_IMAGE=sre-tab:ci deploy/scripts/smoke.sh

      # Everything above this line tested `sre-tab:ci`. `publish` used to run
      # `podman build .` again on its own runner and sign whatever came out,
      # so the signature, the provenance, and the SBOM all described bytes
      # that no smoke test had ever seen. Two builds of one commit agreeing
      # is a reasonable expectation and not a verified one — base-image tags
      # move, apt mirrors differ, and the whole point of signing is to stop
      # relying on reasonable expectations.
      #
      # So the tested image travels instead of the recipe. Only reached when
      # every check above passed, because a failing step fails the job.
      #
      # The tag ref is in these two conditions for the same reason it is in
      # `publish`'s, and it has to be in *all three* or none: a tag build
      # whose `container` job skipped the export reaches `publish` and fails
      # at `download-artifact`, having run the entire gate first. The three
      # conditions are one decision written three times, because GitHub
      # Actions has no anchors and no way to name a boolean once.
      - name: Export the tested image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: podman save --format docker-archive --output "$RUNNER_TEMP/image.tar" sre-tab:ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: tested-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          # Uncompressed. What is actually known: podman's docker-archive
          # stores layer tars uncompressed and writes 212 MB for this
          # image, and at level 0 the hop cost 4s up and 7s down inside
          # GitHub's own storage.
          #
          # What is *not* known is whether a nonzero level would be
          # faster overall — no compressed run has been measured, so the
          # compression cost, the transfer saving, and the net effect are
          # all unquantified. This is therefore a deliberate default and
          # not a tuned optimum, and the numbers above are a baseline
          # rather than a comparison.
          #
          # Two earlier versions of this comment each asserted an
          # optimum. The first reasoned from a `docker save` of the same
          # image (71 MB, because Docker stores the compressed layers) —
          # the wrong tool. The second cited the timings above as though a
          # baseline were a comparison. Both conclusions may well be
          # right; neither was supported, which is the distinction
          # AGENTS.md draws.
          compression-level: 0

  # Everything a deployment is later asked to trust is produced here: the
  # image, a signature over its digest, SLSA provenance, and an SBOM. All
  # three attachments are bound to the *digest*, never to a tag, because a tag
  # is a mutable pointer and signing one would sign nothing durable.
  #
  # Two events reach this job and they publish different things. A push to
  # main publishes `sha-<commit>` and moves `latest`. A version tag publishes
  # `sha-<commit>`, the exact version, the floating minor, and a GitHub
  # Release — and does *not* touch `latest`. The `needs:` chain is identical
  # for both, which is the point of putting the trigger here rather than in a
  # release workflow of its own: a tagged build is gated by the same six jobs
  # as any merge, on the same runner, from the same tested bytes.
  publish:
    name: Publish, sign, and attest image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [python, postgres, audit, sast, frontend, container]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # `contents: write` is here and nowhere else. The workflow default
      # stays `contents: read`, so every other job keeps it; this one needs
      # write because `gh release create` writes a Release object, and that
      # is the smallest grant the API will take for it. There is no
      # finer-grained "releases" scope in the Actions permission set.
      contents: write
      packages: write # push the image and its sigstore attachments
      id-token: write # keyless signing: the OIDC token IS the identity
      attestations: write # provenance and SBOM, recorded against this repo
    steps:
      # fetch-tags, uniquely among this workflow's checkouts, because the
      # resolver below decides whether the floating MAJOR.MINOR tag would
      # move backwards and it can only answer that from the other tags on
      # this minor line. A checkout without them answers "nothing is newer"
      # for every version, which is why release-metadata.py refuses a tag
      # list that does not contain the tag being built rather than trusting
      # a quiet empty answer.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-tags: true

      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install --yes podman
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # First, before anything is downloaded, loaded, or pushed. A tag can be
      # wrong in exactly two ways and both are knowable from the repository
      # alone: its shape, and whether CHANGELOG.md describes the version it
      # names. Asking here costs a second and fails a job that has published
      # nothing; asking at the release step at the bottom would fail a job
      # that had already pushed a signed, attested, publicly pullable image
      # with no Release to explain it — and a registry tag, unlike a draft,
      # cannot be taken back.
      #
      # The logic is a script with a test suite rather than a `case` in YAML:
      # tests/test_release_metadata.py drives it through the refusals as well
      # as the acceptances, in the `python` job, on every push. A guard that
      # has never been seen to go red is not a guard.
      #
      # python3 is the runner image's, not setup-python's — this job has no
      # interpreter step and the script imports nothing outside the standard
      # library, so adding one would buy a version pin nothing here needs.
      - name: Resolve the release version
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git tag --list > "$RUNNER_TEMP/git-tags.txt"
          python3 .github/scripts/release-metadata.py \
            --tag "$GITHUB_REF_NAME" \
            --git-tags-file "$RUNNER_TEMP/git-tags.txt" \
            --notes-out "$RUNNER_TEMP/release-notes.md"

      # A version is published once. `gh release create` at the bottom of
      # this job already refuses to overwrite an existing Release, but it
      # runs *after* the push, and a registry tag cannot be taken back: a
      # re-run of a completed tag build — one button in the Actions UI —
      # would move `:1.1.0` onto freshly built bytes and only then fail,
      # leaving the exact version tag pointing somewhere the Release body
      # and its attached SBOM do not describe. So the question is asked
      # here, before anything is downloaded, tagged, or pushed.
      #
      # This guards the realistic case, which is a re-run or a force-moved
      # tag, and not the case where somebody has deliberately deleted the
      # Release and left the registry tag behind. That one is a considered
      # human act and gets the behaviour it asked for.
      - name: Refuse to republish a version that already has a Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::$GITHUB_REF_NAME already has a Release. A published version is" \
                 "immutable: its registry tag, signature, and SBOM describe one set of bytes." \
                 "To ship a change, tag a new version."
            exit 1
          fi
          echo "no existing Release for $GITHUB_REF_NAME"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-image
          path: ${{ runner.temp }}

      # The load-bearing assertion of this job. `container` published the ID
      # of the image it smoke-tested; if what arrives here is not that image,
      # nothing gets signed. save/load round-trips the config and the layer
      # diff IDs, so the image ID is stable across the transfer — the digest
      # the registry hands back after the push is a different identifier and
      # is what the signature and attestations bind to, which is correct:
      # they describe what was pushed, and what was pushed is what was
      # tested.
      - name: Load the tested image and check it is the one that was tested
        env:
          TESTED_ID: ${{ needs.container.outputs.image-id }}
        run: |
          set -euo pipefail
          test -n "$TESTED_ID" || { echo "::error::container job published no image id"; exit 1; }
          podman load --input "$RUNNER_TEMP/image.tar"
          # By tag, not by ID. Inspecting by the ID and then comparing the
          # result to that same ID asserts almost nothing — it can only
          # succeed or error. What matters is that the tag the next step
          # pushes resolves to the ID the smoke test ran against.
          loaded_id=$(podman image inspect sre-tab:ci --format '{{.Id}}')
          if [ "$loaded_id" != "$TESTED_ID" ]; then
            echo "::error::sre-tab:ci is $loaded_id, but the tested image was $TESTED_ID"
            exit 1
          fi
          echo "loaded the tested image $TESTED_ID"

      - name: Publish
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty on a main build, because the resolver step did not run.
          VERSION_TAGS: ${{ steps.release.outputs.image-tags }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          # One login, at ~/.docker/config.json, because that is the only
          # path all four consumers agree on. Podman would be happy with its
          # own store or any --authfile; cosign and syft honour DOCKER_CONFIG;
          # but the attest actions resolve credentials through
          # @sigstore/oci's getRegistryCredentials, which reads
          # os.homedir()/.docker/config.json and nothing else — DOCKER_CONFIG
          # is not consulted, and the failure it produces ("No credentials
          # found for registry ghcr.io") does not say which file it looked in.
          mkdir -p "$HOME/.docker"
          authfile="$HOME/.docker/config.json"
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin --authfile "$authfile"

          # The one tag every build gets, on either trigger. --digestfile
          # rather than inspecting the local image: this is the digest the
          # registry accepted, and it is what every signature, attestation,
          # and deployment pin below refers to. Every further tag in this
          # step is another name for these same bytes, so the digest is
          # captured once, from the first push.
          podman tag sre-tab:ci "$image:sha-${GITHUB_SHA}"
          podman push --authfile "$authfile" \
            --digestfile "$RUNNER_TEMP/digest" "$image:sha-${GITHUB_SHA}"

          # `latest` belongs to main and to nothing else, and a tag build
          # must not move it. The reasoning is ROADMAP.md's supply-chain
          # entry, which exists because these units used to track a moving
          # tag: whoever pushed last decided what a restart would run. A
          # release moving `latest` would hand that property back — and
          # would do it in the least expected direction, by making a
          # deliberate act change what an unrelated host runs on its next
          # reboot. `latest` therefore stays what it has always been, the
          # tip of main, and a release is asked for by name.
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            podman tag sre-tab:ci "$image:latest"
            podman push --authfile "$authfile" "$image:latest"
            echo "moved $image:latest"
          fi

          # The version tags, on a tag build only: the exact version always,
          # the floating MAJOR.MINOR for a final release and never for a
          # pre-release. Which of those this is was decided by the resolver
          # step, not here — the rule and its reasoning live next to the test
          # that pins them.
          #
          # The word splitting on the next line is the point of it, and it is
          # safe for a stated reason rather than a hopeful one:
          # release-metadata.py builds each element out of a matched semver,
          # so none can contain whitespace or a glob character. The directive
          # sits on that line alone and not above the loop, so everything in
          # the loop body stays checked — actionlint runs shellcheck over
          # these blocks, and a `disable` wide enough to cover the body would
          # switch it off exactly where a mistake would matter.
          # shellcheck disable=SC2086
          set -- $VERSION_TAGS
          for tag in "$@"; do
            podman tag sre-tab:ci "$image:$tag"
            podman push --authfile "$authfile" "$image:$tag"
            echo "published $image:$tag"
          done

          digest=$(cat "$RUNNER_TEMP/digest")
          {
            echo "image=$image"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
          echo "published $image:sha-${GITHUB_SHA} at $digest"

      # Keyless. There is no key to store, rotate, or leak: cosign exchanges
      # this job's OIDC token for a short-lived Fulcio certificate whose
      # subject is this workflow on this ref, and records the signature in
      # Rekor. What a verifier checks is therefore "was this built by
      # Darkflib/sre-tab's ci.yml", which is the question worth asking — not
      # "does this match a key someone put in a secret".
      #
      # "on this ref" is load-bearing and used to be "on main". The subject
      # of a tag build's certificate ends `@refs/tags/v1.1.0`, not
      # `@refs/heads/main`, so a verifier pinned to the branch string rejects
      # a release it should accept. deploy/scripts/verify-image.sh was
      # exactly that verifier, and now matches the set of refs this workflow
      # is permitted to sign from rather than one member of it.
      - name: Sign the manifest
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      # The SBOM is generated from the pushed image rather than the local
      # build, so it describes the bytes the registry serves.
      - name: Generate an SBOM
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: syft "registry:${IMAGE}@${DIGEST}" -o "spdx-json=$RUNNER_TEMP/sbom.spdx.json"

      # actions/attest rather than actions/attest-sbom: the latter is
      # deprecated in favour of this one and is now implemented as a wrapper
      # around it, which is also why the inputs are unchanged — `sbom-path`
      # is a first-class input here and still produces an SBOM attestation.
      #
      # The migration is checked by this job rather than rehearsed, because a
      # publish-only step cannot be rehearsed: `verify-image.sh
      # --require-attestations` runs later here and asserts an SBOM
      # attestation against the image just pushed.
      #
      # Two limits on that, both measured against the published 1.1.0 image
      # rather than assumed, because the first draft of this comment claimed
      # more than the check delivers.
      #
      # `gh attestation verify` matches by *digest*, and will accept any
      # attestation the API holds for that digest — not specifically the one
      # this run just made. What makes the check meaningful is that every
      # build produces a new digest, so on the path that matters the only
      # attestations in existence are this run's. A re-run against an
      # already-published digest would be satisfied by the older attestation,
      # and the "Refuse to republish" step above is what stops that arising.
      #
      # And the predicate assertion is a *prefix* match, not equality. The
      # recorded type is `https://spdx.dev/Document/v2.3`; the verifier asks
      # for `https://spdx.dev/Document` and `gh` matches it. That is
      # deliberate rather than a mistake to tidy — pinning the SPDX version
      # would make an SBOM-format bump look like a supply-chain failure — but
      # it does mean the check answers "an SPDX document is attested", not
      # "exactly this version is". A bogus predicate type is still refused;
      # that was tested, and is what makes it an assertion at all.
      #
      # actions/attest-build-provenance above is NOT deprecated and stays as
      # it is; only the SBOM action was.
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      # The attestation above is the copy that travels with the image. This
      # one is for the human who wants to read it without a registry client.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: ${{ runner.temp }}/sbom.spdx.json
          retention-days: 90

      # Produced is not verified. This runs the same script an operator runs
      # before pinning a digest, against what was just published, so the
      # signature and both attestations are proven checkable from outside the
      # steps that made them.
      - name: Verify what was just published
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: deploy/scripts/verify-image.sh --require-attestations "${IMAGE}@${DIGEST}"

      # Last in the job, and after the verification above rather than before
      # it. A Release is the announcement: it is what a self-hoster reads,
      # what the SBOM hangs off, and the only artefact here that a person
      # will ever look at directly. Announcing a build whose signature or
      # attestations did not check out would be announcing the one thing
      # this pipeline exists to make impossible, so the order is: publish,
      # sign, attest, *prove it verifies from outside*, then say so.
      #
      # `gh` rather than a release action, on the standing rule that every
      # action here is pinned by commit SHA and audited and adding one is a
      # supply-chain decision. gh is preinstalled on the runner and this
      # workflow already trusts it: verify-image.sh runs `gh attestation
      # verify` in the step immediately above.
      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail

          # The notes are CHANGELOG.md's section for this version, extracted
          # by the resolver step at the top of the job — so the Release and
          # the changelog cannot disagree, and neither can be written after
          # the fact to say something the other does not. Appended to them is
          # the one thing the changelog cannot carry, because it does not
          # exist until the push above: the digest, which is what anybody
          # pinning this release actually needs.
          {
            cat "$RUNNER_TEMP/release-notes.md"
            echo
            echo '## Image'
            echo
            echo '```'
            echo "${IMAGE}:${VERSION}@${DIGEST}"
            echo '```'
            echo
            echo 'Verify it before pinning it:'
            echo
            echo '```'
            echo "deploy/scripts/verify-image.sh ${IMAGE}@${DIGEST}"
            echo '```'
          } > "$RUNNER_TEMP/release-body.md"

          # Positional, so the flag is either present or absent rather than
          # present-and-empty — `gh release create ""` is an argument, not a
          # no-op. A pre-release is marked as one so it does not become the
          # repository's "Latest release" banner, which is the same call the
          # floating :MAJOR.MINOR tag makes in the registry.
          if [ "$PRERELEASE" = true ]; then
            set -- --prerelease
          else
            set --
          fi

          # --verify-tag: refuse to invent a tag. Without it, gh will create
          # the git tag as well, which on this path could only mean the tag
          # that triggered the run has gone missing underneath it — worth
          # failing on rather than papering over.
          #
          # There is deliberately no --clobber equivalent here: `gh release
          # create` fails if a Release already exists for this tag, and that
          # is the behaviour wanted. Re-running a tag build must not silently
          # rewrite the notes of a release people have already read.
          gh release create "$GITHUB_REF_NAME" "$@" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-body.md" \
            "$RUNNER_TEMP/sbom.spdx.json#SPDX SBOM (${VERSION})"
