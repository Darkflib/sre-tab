# Cause the off-host copy, rather than schedule it.
#
# A drop-in and not an edit to deploy/quadlet/sre-tab-backup.container: that
# unit is generated by Quadlet, and systemd merges drop-ins for generated units
# from /etc/systemd/system/<unit>.d/ exactly as it does for ordinary ones. The
# Quadlet file is left alone, so a change to the backup container and a change
# to the off-host copy never touch the same file.
#
# OnSuccess= rather than a timer of its own. A second timer would have to be
# placed after the backup's 03:22 start and its 20 minutes of jitter, which
# encodes the backup's schedule in a second place and goes wrong the moment
# either moves or the host catches up on a missed run after downtime. It would
# also copy last night's dump on a night the backup failed, and exit zero.
# OnSuccess= says the thing that is actually true: this runs when a backup has
# just succeeded, and does not run when one has just failed.
#
# The trade-off, stated because it is the one an operator will meet: the copy
# has no timer, so `systemctl list-timers` will never show it. Its evidence is
# the journal and the unit's own state --
#
#     systemctl status sre-tab-backup-offsite.service
#     journalctl -u sre-tab-backup-offsite.service --since -7d
#
# Verified on Debian 13 / systemd 257 in both directions: a backup exiting 0
# starts the copy, and a backup exiting 7 does not.

[Unit]
OnSuccess=sre-tab-backup-offsite.service
